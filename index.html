<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ian’s Farm</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font:700 14px/1.25 "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;background:#cfe6ff}
button{font:inherit;color:inherit;cursor:pointer}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#b9defc,#e7d4ff 60%,#ffe0ee);user-select:none}
.bl{position:absolute;border-radius:50%}.b1{width:30vmax;height:30vmax;left:-8vmax;top:20%;background:#a98be0aa}.b2{width:24vmax;height:24vmax;right:-6vmax;top:-4vmax;background:#ffd0e0aa}
#farm{--W:min(64vw,90vh,520px);position:absolute;left:50%;top:50%;width:var(--W);height:var(--W);transform:translate(-50%,-47%)}
.fr,.bs,#iso{position:absolute;inset:0}
.fr{background:#2e5aa0;border-radius:16px;transform:translateY(calc(var(--W)*.14)) scaleY(.62) rotate(45deg) scale(1.07)}
.bs{background:#8b5a36;border-radius:16px;transform:translateY(calc(var(--W)*.075)) scaleY(.62) rotate(45deg) scale(1.03)}
#iso{background:#78c943;border-radius:14px;transform:scaleY(.62) rotate(45deg);padding:4.5%;display:grid;grid-template:repeat(4,1fr)/repeat(4,1fr);gap:3.5%}
.t{display:grid;place-items:center;padding:0;border:0;border-radius:12%;position:relative}
.t.g{background:#9ae35b;box-shadow:inset 0 0 0 3px #7cc342}.t.d{background:#a9724a;box-shadow:inset 0 0 0 3px #8c5a38}
.t.rd{box-shadow:inset 0 0 0 3px #ffd54a,0 0 16px #ffd54a}
.c{transform:rotate(-45deg) scaleY(1.613);display:flex;align-items:center;justify-content:center;position:relative}
.em{font-size:calc(var(--W)*.1);line-height:1}.sm{font-size:calc(var(--W)*.07)}.lk{font-size:calc(var(--W)*.06);opacity:.8}
.bub{position:absolute;left:50%;top:-100%;margin:-4px 0 0 -14px;width:28px;height:28px;border-radius:50%;background:radial-gradient(#ffe27a,#e8960f);border:2px solid #fff3b0;display:grid;place-items:center;font-size:14px;animation:bob .8s infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){.bub{animation:none}}
.fence{position:absolute;width:26%;height:7%;pointer-events:none;background:repeating-linear-gradient(90deg,#8a5a2e 0 5px,transparent 5px 14px),linear-gradient(#b8854a,#b8854a) 0 40%/100% 18% no-repeat}
.f1{left:2%;top:21%;transform:skewY(-31deg)}.f2{left:72%;top:21%;transform:skewY(31deg)}
.frog{position:absolute;left:46%;bottom:2px;font-size:44px;pointer-events:none}
#undoB{position:absolute;left:8px;top:10px;width:44px;height:44px;border-radius:50%;border:2px solid #fff8;background:#0006;font-size:22px;line-height:1;padding:0}#undoB small{display:block;font-size:9px}#undoB:disabled{opacity:.35}
.prof{position:absolute;left:58px;top:8px;display:flex;gap:8px;align-items:center;background:linear-gradient(90deg,#241f2ccc 70%,#241f2c00);padding:4px 28px 4px 4px;cursor:pointer;text-shadow:0 1px 2px #000}
.av{width:44px;height:44px;border:2px solid #d9b45d;background:#5a2b2b;display:grid;place-items:center;font-size:26px}
.xp{display:flex;align-items:center;gap:6px;margin-top:3px}.lvb{background:#d9a441;color:#4a2a05;border-radius:6px;padding:0 6px;font-size:13px;text-shadow:none}.xb{width:90px;height:8px;background:#0008;border-radius:4px;overflow:hidden}.xb i{display:block;height:100%;background:#ffc93c}
.chips{position:absolute;left:8px;top:64px;display:flex;flex-wrap:wrap;gap:6px;max-width:58vw}
.chip{background:#000a;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}.mb{height:5px;background:#fff3;border-radius:3px;margin-top:2px;overflow:hidden}.mb i{display:block;height:100%}
.coin{position:absolute;right:10px;top:10px;background:#000a;border-radius:20px;padding:4px 16px 4px 8px;font-size:17px;display:flex;gap:8px;align-items:center}
.side{position:absolute;right:10px;top:58px;display:flex;flex-direction:column;gap:8px}
.sb{background:none;border:0;font-size:10px;text-shadow:0 1px 2px #000;text-align:center;padding:0}
.ic{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 2px;font-size:22px;border-radius:50%;background:linear-gradient(#ff80ab,#a8245f);border:3px solid #ffd97a}
#sign,#got,#tip{position:absolute;opacity:0;transition:.2s;pointer-events:none;z-index:5}.vis{opacity:1!important}
#sign{left:50%;top:12%;transform:translateX(-50%);background:#f2e0c3;color:#4a3a2a;border:3px solid #b99362;border-radius:10px;padding:6px 16px;white-space:nowrap}
#got{left:50%;top:70px;transform:translateX(-50%);background:#352a1d;border:2px solid #b99362;color:#9be58b;padding:6px 26px;border-radius:6px;white-space:nowrap}
#tip{left:10px;bottom:70px;background:#2f2517ee;border:2px solid #7a5a2a;padding:8px 12px;border-radius:6px;font-size:13px;min-width:180px;color:#e8dcc0}
.ban{position:absolute;left:8px;bottom:10px;max-width:58vw;background:linear-gradient(90deg,#6b3b3b,#80493f);border:2px solid #c99a62;border-radius:6px 24px 24px 6px;padding:9px 26px 9px 44px;font-size:14px;cursor:pointer}
.ban::before{content:"★";position:absolute;left:-8px;top:50%;margin-top:-20px;width:40px;height:40px;line-height:34px;text-align:center;background:#a8245f;border:3px solid #ffd97a;border-radius:50%;font-size:18px}.ban b{color:#7be37b}
.dm{position:absolute;right:8px;bottom:8px;display:flex;gap:14px;align-items:center}
.dmb{width:46px;height:46px;border-radius:10px;border:3px solid #ffd97a;background:linear-gradient(#ff80ab,#a8245f);transform:rotate(45deg);display:grid;place-items:center;padding:0;margin:6px}.dmb b{transform:rotate(-45deg);font-size:22px}
.dmb.big{width:54px;height:54px;border-radius:50%;transform:none;background:#1e5c46}.dmb.big b{transform:none}
.cc{position:absolute;right:0;bottom:-6px;font-size:11px;background:#000a;border-radius:8px;padding:0 6px}
#tray{position:absolute;left:0;right:0;bottom:0;background:#3a2f26;border-top:4px solid #8a6a3a;padding:8px 10px 12px;display:none;z-index:6}#tray.on{display:block}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.gr,.gr2{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}.gr2{grid-template-columns:repeat(auto-fill,64px)}
.it{position:relative;height:72px;border:3px solid #2d8f86;background:#2fb3a6;border-radius:6px;display:grid;place-items:center;padding:0;color:#fff}.it.sel{border-color:#fff;box-shadow:0 0 8px #ffe27a}.it.lock{filter:grayscale(.7);opacity:.8}
.it b{position:absolute;right:5px;bottom:2px;font-size:14px}.it small{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px}.bag{font-size:30px;margin-top:-8px}
#ov{position:absolute;inset:0;background:#000a;display:none;place-items:center;z-index:20}#ov.on{display:grid}
.mod{position:relative;width:min(94vw,780px);max-height:88vh;overflow:auto;background:#eadbe4;color:#6e5849;border:5px solid #d4ae55;border-radius:14px;padding:16px}
.mod h2{margin:0 0 10px;text-align:center;color:#a67c23;font-size:22px}.mod p{margin:4px 0}
.x,.x2{position:absolute;right:8px;top:6px;width:34px;height:34px;border-radius:50%;border:2px solid #ffe08a;background:#a8245f;color:#fff;font-size:16px;padding:0}.x2{position:static}
.mw{display:flex;gap:12px;flex-wrap:wrap}.tabs{display:flex;flex-direction:column;gap:6px;min-width:110px}
.tb{border:0;background:none;color:#8a7a70;font-weight:800;padding:12px 8px}.tb.on{background:linear-gradient(90deg,#c0214f,#8d1a45);color:#fff}
.mg{background:linear-gradient(#d4408a,#9c2160);color:#fff;border:3px solid #e6c26a;border-radius:10px;padding:8px 20px;font-weight:800}.mg:disabled{background:#888;border-color:#aaa;opacity:.7}.mg.sm{padding:4px 12px;font-size:12px}
.row{display:flex;align-items:center;gap:8px;background:#f7edf2;border-radius:10px;padding:8px 10px}.ri{background:#4a74c9;color:#fff;border-radius:4px;padding:2px 6px;font-size:12px}
.ch{background:#b42453;color:#fff;text-align:center;padding:8px;border-radius:4px;font-weight:800}
.pb{height:14px;background:#3a3332;border-radius:7px;overflow:hidden;margin:6px 0}.pb i{display:block;height:100%;background:#ffb938}
select{font:inherit;width:100%;padding:8px;border-radius:8px;border:2px solid #d4ae55;background:#fff;color:#4a3a30}
pre{margin:8px 0;padding:10px;border-radius:8px;background:#0f2036;color:#cfe3ff;font:12px/1.5 Consolas,monospace;overflow-x:auto;white-space:pre}#out{color:#ffcf6b;min-height:70px}
ol{margin:0 0 10px;padding-left:22px;max-height:50vh;overflow:auto}
</style></head><body>
<div id="stage"><div class="bl b1"></div><div class="bl b2"></div>
<div id="farm"><div class="fr"></div><div class="bs"></div><div id="iso"></div><div class="fence f1"></div><div class="fence f2"></div></div>
<div class="frog">🐸</div>
<button id="undoB" onclick="undo()" aria-label="Undo (Stack Pop)">↩<small>Undo</small></button>
<div class="prof" onclick="M('up')"><div class="av">🧙</div><div><div>Ian’s Farm</div><div class="xp"><span class="lvb" id="lv">1</span><div class="xb"><i id="xpf"></i></div></div></div></div>
<div class="chips" id="chips"></div>
<div class="coin" title="Coins / Dues"><span>🪙</span><b id="coin">0</b></div>
<div class="side"><button class="sb" onclick="M('lab')"><span class="ic">💻</span>CODE LAB</button><button class="sb" onclick="M('his')"><span class="ic">📜</span>HISTORY</button></div>
<div id="sign"></div><div id="got"></div><div id="tip"></div>
<div class="ban" id="ban" onclick="M('mis')"></div>
<div class="dm"><button class="dmb" onclick="M('wh')" aria-label="Warehouse"><b>🏠</b></button><button class="dmb" onclick="trayT()" aria-label="Seed bag"><b>🛍️</b></button><button class="dmb big" onclick="M('comp')" aria-label="Compendium"><b>📖</b></button><div class="cc" id="cc"></div></div>
<div id="tray"></div><div id="ov"><div class="mod" id="mod"></div></div></div>
<script>
const CROPS={radish:{n:"Radish",e:"🧅",p:0,t:10,v:5,m:"Golden",f:"sepia(1) saturate(4)"},wheat:{n:"Wheat",e:"🌾",p:10,t:20,v:15,m:"Purple",f:"hue-rotate(235deg) saturate(2)"},carrot:{n:"Carrot",e:"🥕",p:25,t:30,v:40,m:"Pink",f:"hue-rotate(300deg) saturate(1.5)"}};
const LOCKED=[["Tomato",3,"🍅"],["Mushroom",4,"🍄"],["Sunflower",5,"🌻"]],CAP={water:200,seeds:100,solar:120,hope:100};
const MIS=[["Plant wheat 4 times","pw",4,50],["Water your crops 3 times","wa",3,50],["Harvest 8 wheat","hw",8,100],["Buy 2 carrot seed bags","bc",2,80],["Reclaim your 4th plot","rc",1,100]],DAY=[["(Daily) Log in to the game","login",1,100],["(Daily) Run any code lab","lab",1,200]];
let S={coins:120,water:100,solar:0,hope:0,lv:1,xp:0,seeds:{radish:6,wheat:4,carrot:0},store:{},mut:{},seen:{},rec:[1,1,1].concat(Array(13).fill(0)),plots:Array(16).fill(null),done:{},st:{login:1},cl:{}},H=[],cur=null,wt="idle",ms=1,mq=1,mt="main",ls=8,sel="wheat",tr=false,lastSig="";
const $=id=>document.getElementById(id),tot=()=>Object.values(S.seeds).reduce((a,b)=>a+b,0),TM={};
const ready=p=>p&&p.w&&Date.now()-p.wAt>=CROPS[p.c].t*(1-.01*S.lv)*1000;
const nm=(c,m)=>CROPS[c].n+(m?" ("+CROPS[c].m+")":""),ico=(c,m)=>`<span class="bag" style="${m?"filter:"+CROPS[c].f:""}">${CROPS[c].e}</span>`;
function show(id,ms=2600){const e=$(id);e.classList.add("vis");clearTimeout(TM[id]);TM[id]=setTimeout(()=>e.classList.remove("vis"),ms)}
function say(t){$("sign").textContent=t;show("sign")}function got(t){$("got").textContent=t;show("got",3000)}
function push(l){H.push({label:l,snap:JSON.stringify(S)});if(H.length>60)H.shift()}
function undo(){const h=H.pop();if(!h)return;const s=S.solar;S=JSON.parse(h.snap);S.solar=s;lastSig="";say("Popped: "+h.label);render()}
const ev=k=>S.st[k]=(S.st[k]||0)+1;
function tap(i){const p=S.plots[i];
 if(!S.rec[i]){const n=1+(i>>2);if(S.lv<n)return say("Not reclaimed (Lvl "+n+")");if(S.coins<20)return say("Reclaiming costs 20 coins");push("Reclaim plot #"+i);S.coins-=20;S.rec[i]=1;ev("rc");say("Plot reclaimed!")}
 else if(!p){if(!S.seeds[sel])return say("No "+CROPS[sel].n+" seeds. Open the seed bag.");push("Plant "+CROPS[sel].n+" #"+i);S.seeds[sel]--;S.plots[i]={c:sel,at:Date.now(),w:0,m:+(Math.random()*40).toFixed(2),o:1+Math.floor(Math.random()*3)};if(sel=="wheat")ev("pw")}
 else if(!p.w){if(S.water<10)return say("Low water! Tap the Water chip to pump.");push("Water plot #"+i);S.water-=10;p.w=1;p.wAt=Date.now();ev("wa")}
 else if(ready(p)){const k=CROPS[p.c];push("Harvest "+k.n+" #"+i);let a=0,b=0;for(let j=0;j<p.o;j++){if(Math.random()*100<p.m){S.mut[p.c]=(S.mut[p.c]||0)+1;S.seen[p.c+"*"]=1;b++}else{S.store[p.c]=(S.store[p.c]||0)+1;S.seen[p.c]=1;a++}}
  if(p.c=="wheat")S.st.hw=(S.st.hw||0)+p.o;S.hope=Math.min(100,S.hope+2);S.xp+=k.v+5;S.plots[i]=null;got("Obtained: "+[a&&k.n+"×"+a,b&&nm(p.c,1)+"×"+b].filter(Boolean).join(", "))}
 else return tip(i);render()}
function tip(i){const p=S.plots[i],k=CROPS[p.c],T=k.t*(1-.01*S.lv)*1000,e=Math.min(T,Date.now()-p.wAt),r=Math.ceil((T-e)/1000),f=x=>String(x).padStart(2,"0");
 $("tip").innerHTML=`<b>${k.n}</b><div class="pb"><i style="width:${e/T*100}%"></i></div>Ripens in: 00:${f(Math.floor(r/60))}:${f(r%60)}<br>Mutation Probability<br><b>${p.m}%</b><br>Output <b>${p.o}/3</b>`;show("tip")}
function pump(){if(S.solar<20)return say("Pump needs 20 Wh of Solar Energy");if(S.water>=200)return say("Water tank is full");push("Pump water");S.solar-=20;S.water=Math.min(200,S.water+40);render()}
function dues(){if(S.coins<30)return say("Dues cost 30 coins");push("Pay dues");S.coins-=30;S.hope=Math.min(100,S.hope+10);render()}
function buy(c,q){const k=CROPS[c];if(S.coins<k.p*q)return say("Not enough coins");if(tot()+q>CAP.seeds)return say("Seed bank is full");push("Buy "+k.n+" seed x"+q);S.coins-=k.p*q;S.seeds[c]+=q;if(c=="carrot")S.st.bc=(S.st.bc||0)+q;render()}
function sell(){let v=0;for(const c in S.store)v+=S.store[c]*CROPS[c].v;if(!v)return say("Nothing to sell");push("Batch sell");S.coins+=Math.round(v*(1+.013*S.lv));S.store={};render()}
function lvUp(){push("Upgrade farm");S.coins-=S.lv*100;S.xp-=S.lv*60;S.lv++;render()}
function claim(id,r){S.cl[id]=1;S.coins+=r;S.xp+=100;render()}
function claimAll(){[["m",MIS],["d",DAY]].forEach(([p,L])=>L.forEach((x,i)=>{if(!S.cl[p+i]&&(S.st[x[1]]||0)>=x[2]){S.cl[p+i]=1;S.coins+=x[3];S.xp+=100}}));render()}
function trayT(){tr=!tr;render()}
const CH=[["💧","Water","water",200,"L","#3b9eff","pump()"],["⚡","Solar","solar",120,"Wh","#f5a524",""],["💚","Hope","hope",100,"","#ef5b5b","dues()"],["🌱","Seeds",null,100,"","#34c759","trayT()"]];
$("chips").innerHTML=CH.map((c,i)=>`<div class="chip" id="ch${i}" onclick="${c[6]}"><span></span><div class="mb"><i style="background:${c[5]}"></i></div></div>`).join("");
function tiles(){const sg=S.plots.map((p,i)=>!S.rec[i]?"L"+(S.lv<1+(i>>2)?1:0):!p?"E":p.c+(!p.w?"D":ready(p)?"R":"G")).join();if(sg===lastSig)return;lastSig=sg;
 $("iso").innerHTML=S.plots.map((p,i)=>{let c="t g",x="";
  if(S.rec[i]){c="t d";if(p){if(!p.w)x=`<div class="bub">💧</div><span class="em sm">🌱</span>`;else if(ready(p)){c+=" rd";x=`<div class="bub">✋</div><span class="em">${CROPS[p.c].e}</span>`}else x=`<span class="em sm">🌱</span>`}}
  else if(S.lv<1+(i>>2))x=`<span class="lk">🔒</span>`;
  return `<button class="${c}" onclick="tap(${i})" aria-label="Plot ${i+1}"><div class="c">${x}</div></button>`}).join("")}
function hud(){tiles();CH.forEach((c,i)=>{const v=c[2]?S[c[2]]:tot(),e=$("ch"+i);e.firstChild.textContent=c[0]+" "+c[1]+" "+Math.floor(v)+"/"+c[3]+c[4];e.lastChild.firstChild.style.width=v/c[3]*100+"%"});
 $("lv").textContent=S.lv;$("xpf").style.width=Math.min(100,S.xp/(S.lv*60)*100)+"%";$("coin").textContent=S.coins;$("undoB").disabled=!H.length;$("cc").textContent=Object.keys(S.seen).length+"/6";
 const mi=MIS.findIndex((x,i)=>!S.cl["m"+i]);$("ban").innerHTML=mi<0?"All main missions done!":`${MIS[mi][0]} <b>${Math.min(S.st[MIS[mi][1]]||0,MIS[mi][2])}/${MIS[mi][2]}</b>`}
function render(){hud();$("tray").classList.toggle("on",tr);
 if(tr)$("tray").innerHTML=`<div class="th"><b>ALL</b><span><button class="mg sm" onclick="M('shop')">SEED SHOP</button> <button class="x2" onclick="trayT()" aria-label="Close">✕</button></span></div><div class="gr2">`+Object.keys(CROPS).filter(c=>S.seeds[c]>0||sel==c).map(c=>`<button class="it ${sel==c?"sel":""}" onclick="sel='${c}';render()"><span class="bag">${CROPS[c].e}</span><b>x${S.seeds[c]}</b></button>`).join("")+`</div>`;
 if(cur&&cur!="lab")M(cur)}
function M(n){cur=n;$("mod").innerHTML=`<button class="x" onclick="C()" aria-label="Close">✕</button>`+({mis,up,wh,shop,comp,lab:labM,his}[n])();$("ov").classList.add("on");if(n=="lab")showCode()}
function C(){cur=null;$("ov").classList.remove("on")}
function mis(){const L=mt=="main"?MIS:DAY,P=mt=="main"?"m":"d";return `<h2>MISSIONS</h2><div class="mw"><div class="tabs"><button class="tb ${mt=="main"?"on":""}" onclick="mt='main';M('mis')">MAIN MISSIONS</button><button class="tb ${mt=="main"?"":"on"}" onclick="mt='day';M('mis')">DAILY MISSIONS</button></div><div style="flex:1;display:grid;gap:8px;min-width:240px">${mt=="main"?`<div class="ch">CHAPTER 1 · THE FIRST SPROUTS</div>`:""}${L.map((x,i)=>{const c=Math.min(S.st[x[1]]||0,x[2]),ok=c>=x[2];return `<div class="row"><span style="flex:1">${x[0]} <b style="color:#b0306a">${c}/${x[2]}</b></span><span class="ri">XP 100</span><span class="ri">🪙 ${x[3]}</span>${S.cl[P+i]?"<b>✓</b>":ok?`<button class="mg sm" onclick="claim('${P+i}',${x[3]})">CLAIM</button>`:"🔒"}</div>`}).join("")}</div></div><div style="text-align:right;margin-top:10px"><button class="mg" onclick="claimAll()">CLAIM ALL</button></div>`}
function up(){const n=S.lv*60,cost=S.lv*100;return `<h2>UPGRADE FARM</h2><div style="text-align:center"><b style="font-size:20px">LV.${S.lv} → LV.${S.lv+1}</b><div class="pb"><i style="width:${Math.min(100,S.xp/n*100)}%"></i></div>${S.xp}/${n} XP</div><div class="row" style="justify-content:space-around;margin:12px 0"><span>Grow Time Reduction<br><b>${S.lv}% → ${S.lv+1}%</b></span><span>Sale Price Boost<br><b>${(1.3*S.lv).toFixed(1)}% → ${(1.3*S.lv+1.3).toFixed(1)}%</b></span></div><p>Next unlock: ${LOCKED.filter(x=>x[1]==S.lv+1).map(x=>x[2]+" "+x[0]).join(", ")||"more plots to reclaim"}</p><div style="text-align:center;margin-top:10px"><button class="mg" ${S.xp>=n&&S.coins>=cost?"":"disabled"} onclick="lvUp()">🪙 ${cost} UPGRADE</button> <button class="mg" onclick="dues()">Pay dues 30</button></div>`}

 return `<h2>COMPENDIUM</h2><h3>Wheats and Carrots ${n}/6</h3><div class="gr">${g1.map(it).join("")}</div><h3>Mushroomato Garden 0/6</h3><div class="gr">${[1,2,3,4,5,6].map(()=>`<div class="it lock"><span class="bag">❔</span><small>Locked</small></div>`).join("")}</div>`}
